services:
  postgres:
    image: postgres:latest
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - pgnetwork

  pgadmin:
    image: dpage/pgadmin4:latest
    env_file:
      - .env
    ports:
      - "80:80"
    depends_on:
      - postgres
    networks:
      - pgnetwork
    restart: always

networks:
  pgnetwork:
    driver: bridge

volumes:
  postgres_data: